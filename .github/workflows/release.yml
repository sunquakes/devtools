name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      skip_changelog:
        description: 'Skip changelog update (use existing version)'
        required: false
        type: boolean
        default: false

env:
  PACKAGE_NAME: Sunquakes.DevToolsPro
  DISPLAY_NAME: DevTools Pro
  PUBLISHER_ID: ${{ secrets.PUBLISHER_ID }}
  TARGET_DEVICE_FAMILY: Windows.Desktop
  MIN_OS_VERSION: 10.0.26100.0
  STORE_LISTING_LANGUAGE: zh-CN

jobs:
  extract-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.VERSION }}
      changelog: ${{ steps.extract.outputs.CHANGELOG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version and changelog
        id: extract
        shell: pwsh
        run: |
          $content = Get-Content CHANGELOG.md -Raw
          
          # Normalize line endings
          $content = $content -replace "`r`n", "`n"
          
          if ($content -match '##\s*\[(\d+\.\d+\.\d+)\]\s*-\s*\d{4}-\d{2}-\d{2}') {
            $version = $matches[1]
            Write-Host "Extracted version: $version"
            "VERSION=$version" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "No version found in CHANGELOG.md"
            exit 1
          }
          
          $pattern = '(?s)##\s*\[\d+\.\d+\.\d+\].*?\n(.*?)(?=\n##|\Z)'
          if ($content -match $pattern) {
            $changelogContent = $matches[1].Trim()
            $changelogContent = $changelogContent -replace '### ', '' -replace '\*\*', '' -replace '\* ', '- ' -replace '\n\n', "`n" -replace '\n\n\n', "`n"
            $changelogContent = $changelogContent.Substring(0, [Math]::Min(500, $changelogContent.Length))
            
            Write-Host "Extracted changelog (first 200 chars): $($changelogContent.Substring(0, [Math]::Min(200, $changelogContent.Length)))"
            "CHANGELOG<<EOF" >> $env:GITHUB_OUTPUT
            $changelogContent >> $env:GITHUB_OUTPUT
            "EOF" >> $env:GITHUB_OUTPUT
          }

  build-installer:
    needs: extract-version
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore DevTools.csproj

      - name: Publish win-x86
        run: dotnet publish DevTools.csproj -c Release -r win-x86 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:PublishTrimmed=false -o publish\win-x86

      - name: Publish win-x64
        run: dotnet publish DevTools.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:PublishTrimmed=false -o publish\win-x64

      - name: Publish win-arm64
        run: dotnet publish DevTools.csproj -c Release -r win-arm64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:PublishTrimmed=false -o publish\win-arm64

      - name: Decode signing certificate
        if: env.CERTIFICATE_BASE64 != ''
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [System.IO.File]::WriteAllBytes($certPath, [System.Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          echo "CERT_PATH=$certPath" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Sign executables
        if: env.CERT_PATH != ''
        env:
          CERT_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          $signtool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object { $_.VersionInfo.FileVersion } -Descending | Select-Object -First 1
          
          $exeFiles = @(
            "publish\win-x86\DevTools.exe",
            "publish\win-x64\DevTools.exe",
            "publish\win-arm64\DevTools.exe"
          )
          
          foreach ($exe in $exeFiles) {
            Write-Host "Signing: $exe"
            & $signtool.FullName sign /f $env:CERT_PATH /p $env:CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 /fd SHA256 $exe
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Warning: Failed to sign $exe"
            }
          }
        shell: pwsh

      - name: Install Inno Setup
        run: |
          choco install innosetup -y
        shell: pwsh

      - name: Build Installers
        run: |
          New-Item -ItemType Directory -Force -Path installer
          
          $version = "${{ needs.extract-version.outputs.version }}"
          $rootDir = $PWD.Path
          
          Write-Host "Building x64 installer..."
          & iscc "$rootDir\scripts\installer.iss" /DAppVersion="$version" /DArchitecture="x64" /DOutputDir="$rootDir\installer" /DSourceDir="$rootDir\publish\win-x64"
          
          Write-Host "Building x86 installer..."
          & iscc "$rootDir\scripts\installer.iss" /DAppVersion="$version" /DArchitecture="x86" /DOutputDir="$rootDir\installer" /DSourceDir="$rootDir\publish\win-x86"
          
          Write-Host "Building arm64 installer..."
          & iscc "$rootDir\scripts\installer.iss" /DAppVersion="$version" /DArchitecture="arm64" /DOutputDir="$rootDir\installer" /DSourceDir="$rootDir\publish\win-arm64"
        shell: pwsh

      - name: Sign installers
        if: env.CERT_PATH != ''
        env:
          CERT_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          $signtool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object { $_.VersionInfo.FileVersion } -Descending | Select-Object -First 1
          
          $installerFiles = Get-ChildItem -Path "installer\*.exe"
          
          foreach ($installer in $installerFiles) {
            Write-Host "Signing: $($installer.FullName)"
            & $signtool.FullName sign /f $env:CERT_PATH /p $env:CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 /fd SHA256 $installer.FullName
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Warning: Failed to sign $($installer.FullName)"
            }
          }
        shell: pwsh

      - name: Rename executables
        run: |
          Rename-Item -Path publish\win-x86\DevTools.exe -NewName DevTools-win-x86.exe
          Rename-Item -Path publish\win-x64\DevTools.exe -NewName DevTools-win-x64.exe
          Rename-Item -Path publish\win-arm64\DevTools.exe -NewName DevTools-win-arm64.exe

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-v${{ needs.extract-version.outputs.version }}
          path: |
            publish/win-x86/DevTools-win-x86.exe
            publish/win-x64/DevTools-win-x64.exe
            publish/win-arm64/DevTools-win-arm64.exe
            installer/*.exe
          retention-days: 30

  build-msix:
    needs: extract-version
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Clean
        run: |
          dotnet clean DevTools.csproj -c Release
          if (Test-Path "DevTools.Package\bin") { Remove-Item -Recurse -Force "DevTools.Package\bin" }
          if (Test-Path "DevTools.Package\obj") { Remove-Item -Recurse -Force "DevTools.Package\obj" }

      - name: Restore
        run: dotnet restore DevTools.csproj

      - name: Prepare Package.appxmanifest build copy
        shell: pwsh
        env:
          VERSION: ${{ needs.extract-version.outputs.version }}
          PACKAGE_NAME: ${{ env.PACKAGE_NAME }}
          DISPLAY_NAME: ${{ env.DISPLAY_NAME }}
          PUBLISHER_ID: ${{ env.PUBLISHER_ID }}
        run: |
          # Copy the original manifest to a build copy and replace placeholders there.
          # The original Package.appxmanifest is never modified.
          $srcPath = "DevTools.Package\Package.appxmanifest"
          $buildPath = "DevTools.Package\Package.build.appxmanifest"
          Copy-Item $srcPath $buildPath -Force
          $manifestContent = [System.IO.File]::ReadAllText($buildPath)
          $manifestContent = $manifestContent -replace '\$PACKAGE_NAME\$', "${{ env.PACKAGE_NAME }}"
          $manifestContent = $manifestContent -replace '\$PUBLISHER_ID\$', "${{ env.PUBLISHER_ID }}"
          $manifestContent = $manifestContent -replace '\$DISPLAY_NAME\$', "${{ env.DISPLAY_NAME }}"
          $manifestContent = $manifestContent -replace 'Version="\$VERSION\$"', "Version=`"${{ env.VERSION }}.0`""
          $manifestContent = $manifestContent -replace '\$ARCHITECTURE\$', "x64"
          [System.IO.File]::WriteAllText($buildPath, $manifestContent)

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install UWP workload
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $installer = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe"
          
          Write-Host "VS Path: $vsPath"
          Write-Host "Installer: $installer"
          
          Write-Host "`nInstalling UWP workload..."
          $installArgs = "modify --installPath `"$vsPath`" --add Microsoft.VisualStudio.Workload.Universal --add Microsoft.VisualStudio.Component.UWP.VC.ARM64 --quiet --norestart --wait"
          Write-Host "Command: $installer $installArgs"
          
          $process = Start-Process -FilePath $installer -ArgumentList $installArgs -NoNewWindow -Wait -PassThru
          Write-Host "Exit code: $($process.ExitCode)"
          
          if ($process.ExitCode -ne 0) {
            Write-Warning "Installer exited with code $($process.ExitCode)"
          }
          
          Write-Host "`n=== Checking UAP after install ==="
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Platforms\UAP" -ErrorAction SilentlyContinue | Select-Object Name

      - name: List Windows SDKs
        shell: pwsh
        run: |
          Write-Host "=== UAP SDKs ==="
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Platforms\UAP" -ErrorAction SilentlyContinue | Select-Object Name

          Write-Host "`n=== DesignTime SDKs ==="
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\DesignTime\CommonConfiguration\Neutral" -ErrorAction SilentlyContinue | Select-Object Name

          Write-Host "`n=== Check 10.0.26100.0 directory ==="
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\10.0.26100.0" -ErrorAction SilentlyContinue | Select-Object Name

          Write-Host "`n=== All Windows Kits ==="
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10" -ErrorAction SilentlyContinue | Select-Object Name

      - name: Build MSIX x64
        run: |
          $buildPath = "DevTools.Package\Package.build.appxmanifest"
          $content = [System.IO.File]::ReadAllText($buildPath)
          $content = $content -replace 'ProcessorArchitecture="[^"]*"', 'ProcessorArchitecture="x64"'
          [System.IO.File]::WriteAllText($buildPath, $content)
          msbuild DevTools.Package\DevTools.Package.wapproj /p:Configuration=Release /p:Platform=x64 /t:Build /p:RestorePackages=true /p:AppxManifestFile=Package.build.appxmanifest
        shell: pwsh

      - name: Build MSIX x86
        run: |
          $buildPath = "DevTools.Package\Package.build.appxmanifest"
          $content = [System.IO.File]::ReadAllText($buildPath)
          $content = $content -replace 'ProcessorArchitecture="[^"]*"', 'ProcessorArchitecture="x86"'
          [System.IO.File]::WriteAllText($buildPath, $content)
          msbuild DevTools.Package\DevTools.Package.wapproj /p:Configuration=Release /p:Platform=x86 /t:Build /p:RestorePackages=true /p:AppxManifestFile=Package.build.appxmanifest
        shell: pwsh

      - name: Build MSIX arm64
        run: |
          $buildPath = "DevTools.Package\Package.build.appxmanifest"
          $content = [System.IO.File]::ReadAllText($buildPath)
          $content = $content -replace 'ProcessorArchitecture="[^"]*"', 'ProcessorArchitecture="arm64"'
          [System.IO.File]::WriteAllText($buildPath, $content)
          msbuild DevTools.Package\DevTools.Package.wapproj /p:Configuration=Release /p:Platform=arm64 /t:Build /p:RestorePackages=true /p:AppxManifestFile=Package.build.appxmanifest
        shell: pwsh

      - name: Create MSIX bundle
        shell: pwsh
        run: |
          $version = "${{ needs.extract-version.outputs.version }}"
          $makeappx = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object { $_.VersionInfo.FileVersion } -Descending | Select-Object -First 1

          # MSIX files are generated in *_Test subdirectories under AppPackages
          # Search both possible locations: repo root and DevTools.Package
          $searchPaths = @("AppPackages", "DevTools.Package\AppPackages")
          $allMsixFiles = @()
          foreach ($searchPath in $searchPaths) {
            if (Test-Path $searchPath) {
              $files = Get-ChildItem -Path $searchPath -Recurse -Filter "*.msix" -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -notmatch "_Debug\.msix$" }
              $allMsixFiles += $files
            }
          }

          # Select one MSIX file per architecture (x64, x86, arm64)
          $existingFiles = @()
          foreach ($arch in @("x64", "x86", "arm64")) {
            $archFile = $allMsixFiles | Where-Object { $_.Name -match "_${arch}\.msix$" } | Select-Object -First 1
            if ($archFile) {
              $existingFiles += $archFile.FullName
              Write-Host "Found ${arch}: $($archFile.FullName)"
            } else {
              Write-Host "Missing ${arch} MSIX file"
            }
          }

          if ($existingFiles.Count -eq 0) {
            Write-Host "No MSIX files found, listing all files..."
            foreach ($searchPath in $searchPaths) {
              if (Test-Path $searchPath) {
                Get-ChildItem $searchPath -Recurse | ForEach-Object { Write-Host $_.FullName }
              }
            }
            exit 1
          }

          $bundlePath = "DevTools_${version}_bundle.msixbundle"
          $inputFile = "bundle_input.txt"
          # makeappx bundle expects a mapping file with [Files] header and
          # quoted "source" "destination" pairs (one per line).
          $lines = @("[Files]")
          foreach ($f in $existingFiles) {
            $fileName = Split-Path $f -Leaf
            $lines += "`"$f`" `"$fileName`""
          }
          [System.IO.File]::WriteAllLines($inputFile, $lines)

          Write-Host "Creating bundle: $bundlePath"
          & $makeappx.FullName bundle /f $inputFile /p $bundlePath /o
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to create MSIX bundle"
            exit 1
          }
          Write-Host "Bundle created: $bundlePath"

      - name: Show output
        shell: pwsh
        run: |
          Write-Host "=== AppPackages (repo root) ==="
          Get-ChildItem AppPackages -Recurse -ErrorAction SilentlyContinue

          Write-Host "=== AppPackages (DevTools.Package) ==="
          Get-ChildItem DevTools.Package\AppPackages -Recurse -ErrorAction SilentlyContinue

          Write-Host "=== All MSIX files ==="
          Get-ChildItem . -Recurse -Filter *.msix -ErrorAction SilentlyContinue | Select-Object FullName

          Write-Host "=== All msixbundle files ==="
          Get-ChildItem . -Recurse -Filter *.msixbundle -ErrorAction SilentlyContinue | Select-Object FullName

      - name: Upload MSIX package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: msix-package-v${{ needs.extract-version.outputs.version }}
          path: |
            *.msixbundle
          retention-days: 30

  create-release:
    needs: [extract-version, build-installer, build-msix]
    runs-on: ubuntu-latest
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          name: installer-v${{ needs.extract-version.outputs.version }}
          path: installer

      - name: Download MSIX package
        uses: actions/download-artifact@v4
        with:
          name: msix-package-v${{ needs.extract-version.outputs.version }}
          path: msix

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.extract-version.outputs.version }}
          name: DevTools v${{ needs.extract-version.outputs.version }}
          body: |
            ${{ needs.extract-version.outputs.changelog }}
            
            ## Downloads
            
            ### Installers
            - DevTools-win-x86.exe - Windows 32-bit installer
            - DevTools-win-x64.exe - Windows 64-bit installer
            - DevTools-win-arm64.exe - Windows ARM64 installer
            
            ### MSIX Bundle
            - DevTools_${{ needs.extract-version.outputs.version }}_bundle.msixbundle - Microsoft Store package (includes x64, x86, arm64)
          draft: false
          prerelease: false
          files: |
            installer/DevTools-win-x86.exe
            installer/DevTools-win-x64.exe
            installer/DevTools-win-arm64.exe
            installer/*.exe
            msix/*.msixbundle
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

  publish-to-store:
    needs: [extract-version, create-release]
    runs-on: windows-latest
    steps:
      - name: Download MSIX bundle from Release
        shell: pwsh
        env:
          VERSION: ${{ needs.extract-version.outputs.version }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          $version = $env:VERSION
          $repo = $env:REPO
          $url = "https://github.com/$repo/releases/download/v$version/DevTools_${version}_bundle.msixbundle"
          $output = "DevTools_${version}_bundle.msixbundle"

          Write-Host "Downloading: $url"
          if ($env:GH_TOKEN) {
            $headers = @{ Authorization = "token $env:GH_TOKEN" }
            Invoke-WebRequest -Uri $url -OutFile $output -Headers $headers -UseBasicParsing
          } else {
            Invoke-WebRequest -Uri $url -OutFile $output -UseBasicParsing
          }

          if (Test-Path $output) {
            $size = [math]::Round((Get-Item $output).Length / 1MB, 2)
            Write-Host "Downloaded: $output ($size MB)"
          } else {
            Write-Error "Download failed!"
            exit 1
          }

      - name: Submit MSIX to Microsoft Store
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          PRODUCT_ID: ${{ secrets.STORE_PRODUCT_ID }}
          VERSION: ${{ needs.extract-version.outputs.version }}
        run: |
          $tenantId = $env:TENANT_ID
          $clientId = $env:CLIENT_ID
          $clientSecret = $env:CLIENT_SECRET
          $productId = $env:PRODUCT_ID
          $version = $env:VERSION
          $msixPath = "DevTools_${version}_bundle.msixbundle"

          $apiBase = "https://manage.devcenter.microsoft.com/v1.0/my/applications/$productId/submissions"

          Write-Host "=== Getting access token ==="
          $tokenBody = @{
            grant_type    = "client_credentials"
            client_id     = $clientId
            client_secret = $clientSecret
            scope         = "https://manage.devcenter.microsoft.com/.default"
          }
          $tokenResponse = Invoke-RestMethod -Uri "https://login.microsoftonline.com/$tenantId/oauth2/v2.0/token" -Method POST -Body $tokenBody
          $accessToken = $tokenResponse.access_token
          Write-Host "Got access token"

          $headers = @{
            Authorization = "Bearer $accessToken"
            "Content-Type" = "application/json"
          }

          Write-Host "`n=== Creating new submission (clones last published) ==="
          $createResponse = Invoke-RestMethod -Uri $apiBase -Headers $headers -Method POST
          $submissionId = $createResponse.id
          $uploadUrl = $createResponse.fileUploadUrl
          Write-Host "Submission ID: $submissionId"
          Write-Host "Upload URL obtained"

          Write-Host "`n=== Updating submission with new package reference ==="
          $submissionData = $createResponse
          $fileName = Split-Path $msixPath -Leaf
          if ($submissionData.psobject.properties.match('packages').Count -gt 0 -and $submissionData.packages) {
            $submissionData.packages[0].fileName = $fileName
            $submissionData | ConvertTo-Json -Depth 10 | Out-File -FilePath "submission_update.json" -Encoding UTF8
            $updateBody = Get-Content "submission_update.json" -Raw
            Invoke-RestMethod -Uri "$apiBase/$submissionId" -Headers $headers -Method PUT -Body $updateBody
            Write-Host "Submission data updated"
          } else {
            Write-Host "No packages field to update (using cloned data as-is)"
          }

          Write-Host "`n=== Packaging MSIX bundle into ZIP ==="
          $zipPath = "submission.zip"
          Compress-Archive -Path $msixPath -DestinationPath $zipPath
          $zipSize = [math]::Round((Get-Item $zipPath).Length / 1MB, 2)
          Write-Host "Created: $zipPath ($zipSize MB)"

          Write-Host "`n=== Uploading ZIP to Azure Blob Storage ==="
          $fileBytes = [System.IO.File]::ReadAllBytes($zipPath)
          $blobHeaders = @{
            "x-ms-blob-type" = "BlockBlob"
            "Content-Type"   = "application/zip"
          }
          Invoke-RestMethod -Uri $uploadUrl -Method PUT -Body $fileBytes -Headers $blobHeaders
          Write-Host "Upload completed"

          Write-Host "`n=== Committing submission ==="
          $commitResponse = Invoke-RestMethod -Uri "$apiBase/$submissionId/commit" -Headers $headers -Method POST
          Write-Host "Submission committed"
          Write-Host "Status: $($commitResponse.status)"

          Write-Host "`n=== Submission successful ==="
          Write-Host "Version: $version"
          Write-Host "Product ID: $productId"
          Write-Host "Submission ID: $submissionId"

      - name: Display result
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== Microsoft Store Submission ==="
          Write-Host "Status: Completed"
          Write-Host "Version: ${{ needs.extract-version.outputs.version }}"
          Write-Host "The submission is now pending Microsoft Store review."