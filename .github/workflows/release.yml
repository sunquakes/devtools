name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      skip_changelog:
        description: 'Skip changelog update (use existing version)'
        required: false
        type: boolean
        default: false

env:
  PACKAGE_NAME: Sunquakes.DevToolsPro
  DISPLAY_NAME: DevTools Pro
  PUBLISHER_ID: ${{ secrets.PUBLISHER_ID }}
  TARGET_DEVICE_FAMILY: Windows.Desktop
  MIN_OS_VERSION: 10.0.17763.0
  STORE_LISTING_LANGUAGE: zh-CN

jobs:
  extract-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.VERSION }}
      changelog: ${{ steps.extract.outputs.CHANGELOG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version and changelog
        id: extract
        shell: pwsh
        run: |
          $content = Get-Content CHANGELOG.md -Raw
          
          # Normalize line endings
          $content = $content -replace "`r`n", "`n"
          
          if ($content -match '##\s*\[(\d+\.\d+\.\d+)\]\s*-\s*\d{4}-\d{2}-\d{2}') {
            $version = $matches[1]
            Write-Host "Extracted version: $version"
            "VERSION=$version" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "No version found in CHANGELOG.md"
            exit 1
          }
          
          $pattern = '(?s)##\s*\[\d+\.\d+\.\d+\].*?\n(.*?)(?=\n##|\Z)'
          if ($content -match $pattern) {
            $changelogContent = $matches[1].Trim()
            $changelogContent = $changelogContent -replace '### ', '' -replace '\*\*', '' -replace '\* ', '- ' -replace '\n\n', "`n" -replace '\n\n\n', "`n"
            $changelogContent = $changelogContent.Substring(0, [Math]::Min(500, $changelogContent.Length))
            
            Write-Host "Extracted changelog (first 200 chars): $($changelogContent.Substring(0, [Math]::Min(200, $changelogContent.Length)))"
            "CHANGELOG<<EOF" >> $env:GITHUB_OUTPUT
            $changelogContent >> $env:GITHUB_OUTPUT
            "EOF" >> $env:GITHUB_OUTPUT
          }

  build-installer:
    needs: extract-version
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore DevTools.csproj

      - name: Publish win-x86
        run: dotnet publish DevTools.csproj -c Release -r win-x86 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:PublishTrimmed=false -o publish\win-x86

      - name: Publish win-x64
        run: dotnet publish DevTools.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:PublishTrimmed=false -o publish\win-x64

      - name: Publish win-arm64
        run: dotnet publish DevTools.csproj -c Release -r win-arm64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:PublishTrimmed=false -o publish\win-arm64

      - name: Decode signing certificate
        if: env.CERTIFICATE_BASE64 != ''
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [System.IO.File]::WriteAllBytes($certPath, [System.Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          echo "CERT_PATH=$certPath" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Sign executables
        if: env.CERT_PATH != ''
        env:
          CERT_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          $signtool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object { $_.VersionInfo.FileVersion } -Descending | Select-Object -First 1
          
          $exeFiles = @(
            "publish\win-x86\DevTools.exe",
            "publish\win-x64\DevTools.exe",
            "publish\win-arm64\DevTools.exe"
          )
          
          foreach ($exe in $exeFiles) {
            Write-Host "Signing: $exe"
            & $signtool.FullName sign /f $env:CERT_PATH /p $env:CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 /fd SHA256 $exe
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Warning: Failed to sign $exe"
            }
          }
        shell: pwsh

      - name: Install Inno Setup
        run: |
          choco install innosetup -y
        shell: pwsh

      - name: Download Chinese language file for Inno Setup
        run: |
          $innoPath = "${env:ProgramFiles(x86)}\Inno Setup 6"
          $langPath = Join-Path $innoPath "Languages"
          $chineseFile = Join-Path $langPath "ChineseSimplified.isl"
          
          if (Test-Path $langPath) {
            Write-Host "Inno Setup Languages folder exists"
            Get-ChildItem $langPath -Filter "*.isl" | Select-Object -First 5 | ForEach-Object { Write-Host "  $($_.Name)" }
          }
        shell: pwsh

      - name: Build Installers
        run: |
          New-Item -ItemType Directory -Force -Path installer
          
          $version = "${{ needs.extract-version.outputs.version }}"
          $rootDir = $PWD.Path
          
          Write-Host "Building x64 installer..."
          & iscc "$rootDir\scripts\installer.iss" /DAppVersion="$version" /DArchitecture="x64" /DOutputDir="$rootDir\installer" /DSourceDir="$rootDir\publish\win-x64"
          
          Write-Host "Building x86 installer..."
          & iscc "$rootDir\scripts\installer.iss" /DAppVersion="$version" /DArchitecture="x86" /DOutputDir="$rootDir\installer" /DSourceDir="$rootDir\publish\win-x86"
          
          Write-Host "Building arm64 installer..."
          & iscc "$rootDir\scripts\installer.iss" /DAppVersion="$version" /DArchitecture="arm64" /DOutputDir="$rootDir\installer" /DSourceDir="$rootDir\publish\win-arm64"
        shell: pwsh

      - name: Sign installers
        if: env.CERT_PATH != ''
        env:
          CERT_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          $signtool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object { $_.VersionInfo.FileVersion } -Descending | Select-Object -First 1
          
          $installerFiles = Get-ChildItem -Path "installer\*.exe"
          
          foreach ($installer in $installerFiles) {
            Write-Host "Signing: $($installer.FullName)"
            & $signtool.FullName sign /f $env:CERT_PATH /p $env:CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 /fd SHA256 $installer.FullName
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Warning: Failed to sign $($installer.FullName)"
            }
          }
        shell: pwsh

      - name: Rename executables
        run: |
          Rename-Item -Path publish\win-x86\DevTools.exe -NewName DevTools-win-x86.exe
          Rename-Item -Path publish\win-x64\DevTools.exe -NewName DevTools-win-x64.exe
          Rename-Item -Path publish\win-arm64\DevTools.exe -NewName DevTools-win-arm64.exe

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-v${{ needs.extract-version.outputs.version }}
          path: |
            publish/win-x86/DevTools-win-x86.exe
            publish/win-x64/DevTools-win-x64.exe
            publish/win-arm64/DevTools-win-arm64.exe
            installer/*.exe
          retention-days: 30

  build-msix:
    needs: extract-version
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore DevTools.csproj

      - name: Build Release
        run: dotnet build DevTools.csproj -c Release --no-restore

      - name: Build MSIX Package using WAP Project
        shell: pwsh
        env:
          VERSION: ${{ needs.extract-version.outputs.version }}
          CHANGELOG: ${{ needs.extract-version.outputs.changelog }}
          PACKAGE_NAME: ${{ env.PACKAGE_NAME }}
          DISPLAY_NAME: ${{ env.DISPLAY_NAME }}
          PUBLISHER_ID: ${{ env.PUBLISHER_ID }}
          TARGET_DEVICE_FAMILY: ${{ env.TARGET_DEVICE_FAMILY }}
          MIN_OS_VERSION: ${{ env.MIN_OS_VERSION }}
        run: |
          $version = "${{ env.VERSION }}"
          
          # Validate version format
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "Invalid version format: $version. Expected format: 1.2.3"
            exit 1
          }
          
          # Update Package.appxmanifest with correct values
          $manifestPath = "DevTools.Package/DevTools.Package.appxmanifest"
          $manifestContent = Get-Content $manifestPath -Raw
          
          # Replace placeholders with actual values
          $manifestContent = $manifestContent -replace '\$PACKAGE_NAME\$', "${{ env.PACKAGE_NAME }}"
          $manifestContent = $manifestContent -replace '\$PUBLISHER_ID\$', "${{ env.PUBLISHER_ID }}"
          $manifestContent = $manifestContent -replace '\$DISPLAY_NAME\$', "${{ env.DISPLAY_NAME }}"
          $manifestContent = $manifestContent -replace 'Version="\d+\.\d+\.\d+\.\d+"', "Version=`"$version.0`""
          
          # Write manifest with UTF-8 without BOM
          [System.IO.File]::WriteAllText(
              $manifestPath,
              $manifestContent,
              (New-Object System.Text.UTF8Encoding($false))
          )
          
          Write-Host "Updated manifest with:"
          Write-Host "  Package Name: ${{ env.PACKAGE_NAME }}"
          Write-Host "  Publisher: ${{ env.PUBLISHER_ID }}"
          Write-Host "  Version: $version.0"
          
          # Publish app to a temp location first
          dotnet publish DevTools.csproj -c Release -r win-x64 --self-contained true -o "publish/win-x64"
          
          # Copy published app to WAP project
          $appDest = "DevTools.Package/App"
          New-Item -ItemType Directory -Force -Path $appDest | Out-Null
          Copy-Item -Path "publish/win-x64/*" -Destination $appDest -Recurse -Force
          
          Write-Host "Copied app to WAP project"

      - name: Generate Store Assets
        shell: pwsh
        run: |
          $assetsPath = "DevTools.Package/Images"
          New-Item -ItemType Directory -Force -Path $assetsPath | Out-Null
          
          $logoPath = "Resources/Images/logo.png"
          
          if (Test-Path $logoPath) {
            Write-Host "Found custom logo at $logoPath"
            
            function Create-Image {
              param($sourcePath, $destPath, $width, $height)
              Add-Type -AssemblyName System.Drawing
              $img = [System.Drawing.Image]::FromFile($sourcePath)
              $newImg = New-Object System.Drawing.Bitmap($width, $height)
              $graphics = [System.Drawing.Graphics]::FromImage($newImg)
              $graphics.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
              $graphics.DrawImage($img, 0, 0, $width, $height)
              $newImg.Save($destPath, [System.Drawing.Imaging.ImageFormat]::Png)
              $graphics.Dispose()
              $newImg.Dispose()
              $img.Dispose()
              Write-Host "Created: $destPath ($width x $height)"
            }
            
            Create-Image $logoPath "$assetsPath/StoreLogo.png" 50 50
            Create-Image $logoPath "$assetsPath/Square150x150Logo.png" 150 150
            Create-Image $logoPath "$assetsPath/Square44x44Logo.png" 44 44
            Create-Image $logoPath "$assetsPath/Square71x71Logo.png" 71 71
            Create-Image $logoPath "$assetsPath/Wide310x150Logo.png" 310 150
            Create-Image $logoPath "$assetsPath/SplashScreen.png" 620 300
            Create-Image $logoPath "$assetsPath/Square310x310Logo.png" 310 310
          } else {
            Write-Host "No custom logo found, using placeholder images"
            function Create-Placeholder {
              param($w, $h, $name)
              Add-Type -AssemblyName System.Drawing
              $bmp = New-Object System.Drawing.Bitmap($w, $h)
              $graphics = [System.Drawing.Graphics]::FromImage($bmp)
              $graphics.Clear([System.Drawing.Color]::FromArgb(64, 64, 64))
              $font = New-Object System.Drawing.Font("Arial", [Math]::Min($w, $h) / 4)
              $brush = [System.Drawing.Brushes]::White
              $sf = New-Object System.Drawing.StringFormat
              $sf.Alignment = [System.Drawing.StringAlignment]::Center
              $sf.LineAlignment = [System.Drawing.StringAlignment]::Center
              $rect = New-Object System.Drawing.RectangleF(0, 0, $w, $h)
              $graphics.DrawString("DT", $font, $brush, $rect, $sf)
              $bmp.Save("$assetsPath/$name", [System.Drawing.Imaging.ImageFormat]::Png)
              $graphics.Dispose()
              $bmp.Dispose()
              Write-Host "Created placeholder: $name ($w x $h)"
            }
            Create-Placeholder 50 50 "StoreLogo.png"
            Create-Placeholder 150 150 "Square150x150Logo.png"
            Create-Placeholder 44 44 "Square44x44Logo.png"
            Create-Placeholder 71 71 "Square71x71Logo.png"
            Create-Placeholder 310 150 "Wide310x150Logo.png"
            Create-Placeholder 620 300 "SplashScreen.png"
            Create-Placeholder 310 310 "Square310x310Logo.png"
          }

      - name: Build MSIXUpload with msbuild
        shell: pwsh
        env:
          VERSION: ${{ needs.extract-version.outputs.version }}
        run: |
          $version = "${{ env.VERSION }}"
          
          # Find MSBuild
          $vsPath = "C:\Program Files (x86)\Microsoft Visual Studio\Installer"
          $msbuildPath = & "$vsPath\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          
          if (-not $msbuildPath) {
            Write-Host "MSBuild not found, trying default path"
            $msbuildPath = "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\MSBuild\Current\Bin\MSBuild.exe"
          }
          
          if (-not (Test-Path $msbuildPath)) {
            Write-Host "Error: MSBuild not found at $msbuildPath"
            exit 1
          }
          
          Write-Host "Using MSBuild: $msbuildPath"
          
          # Build WAP project to generate .msixupload
          $wapprojPath = "DevTools.Package\DevTools.Package.wapproj"
          $outputPath = "artifacts\AppPackages"
          
          & $msbuildPath $wapprojPath `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:AppxPackageDir=$outputPath\ `
            /p:UapAppxPackageBuildMode=StoreUpload `
            /p:GenerateAppInstallerFile=false `
            /p:AppxBundle=Never `
            /p:AppxPackageSigningEnabled=false `
            /t:Build `
            /v:minimal
          
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Error: MSBuild failed"
            exit 1
          }
          
          Write-Host "MSIXUpload package created"
          Get-ChildItem -Path $outputPath -Recurse | ForEach-Object {
            Write-Host "$($_.Name) - $([math]::Round($_.Length / 1MB, 2)) MB"
          }

      - name: Upload MSIX package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: msix-package-v${{ needs.extract-version.outputs.version }}
          path: |
            artifacts/AppPackages/*.msixupload
            artifacts/AppPackages/*.msix
          retention-days: 30

  create-release:
    needs: [extract-version, build-installer, build-msix]
    runs-on: ubuntu-latest
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          name: installer-v${{ needs.extract-version.outputs.version }}
          path: installer

      - name: Download MSIX package
        uses: actions/download-artifact@v4
        with:
          name: msix-package-v${{ needs.extract-version.outputs.version }}
          path: msix

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.extract-version.outputs.version }}
          name: DevTools v${{ needs.extract-version.outputs.version }}
          body: |
            ${{ needs.extract-version.outputs.changelog }}
            
            ## Downloads
            
            ### Installers
            - DevTools-win-x86.exe - Windows 32-bit installer
            - DevTools-win-x64.exe - Windows 64-bit installer
            - DevTools-win-arm64.exe - Windows ARM64 installer
            
            ### MSIX Package
            - DevTools_${{ needs.extract-version.outputs.version }}_x64.msix - Microsoft Store package
          draft: false
          prerelease: false
          files: |
            installer/DevTools-win-x86.exe
            installer/DevTools-win-x64.exe
            installer/DevTools-win-arm64.exe
            installer/*.exe
            msix/*.msixupload
            msix/*.msix
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

  publish-to-store:
    needs: [extract-version, build-msix]
    runs-on: windows-latest
    steps:
      - name: Download MSIX package
        uses: actions/download-artifact@v4
        with:
          name: msix-package-v${{ needs.extract-version.outputs.version }}
          path: downloaded

      - name: Find MSIXUpload
        id: package
        shell: pwsh
        run: |
          $file = Get-ChildItem downloaded -Recurse -Filter *.msixupload | Select-Object -First 1
          if (-not $file) {
            Write-Error "No .msixupload found in downloaded folder"
            Get-ChildItem downloaded -Recurse | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          Write-Host "Found package: $($file.FullName)"
          "PACKAGE=$($file.FullName)" >> $env:GITHUB_OUTPUT

      - name: Verify package
        shell: pwsh
        run: |
          Write-Host "=== Downloaded files ==="
          Get-ChildItem downloaded -Recurse | ForEach-Object {
            Write-Host "$($_.FullName) - $([math]::Round($_.Length / 1MB, 2)) MB"
          }

      - name: Publish To Store
        uses: microsoft/store-submission@v1
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          app-id: ${{ secrets.STORE_PRODUCT_ID }}
          package-path: ${{ steps.package.outputs.PACKAGE }}

      - name: Display result
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== Microsoft Store Submission ==="
          Write-Host "Status: Completed"
          Write-Host "Version: ${{ needs.extract-version.outputs.version }}"
          Write-Host "The submission is now pending Microsoft Store review."