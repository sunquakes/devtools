## Important Notes

### Store API Limitations
- Microsoft Store API requires additional Azure Blob Storage setup for MSIX upload
- For full automation, you need:
  1. Azure Storage Account
  2. SAS token for upload
  3. Complete submission workflow implementation

### Manual vs Auto
**Without secrets:** Workflow creates MSIX, you download and upload manually
**With secrets:** Workflow attempts auto-publish (requires Blob Storage setup)

### Publishing Flow
1. Create submission → 2. Upload MSIX → 3. Update metadata → 4. Commit submission

### Testing
Test the workflow first without secrets, then add secrets for partial automation.
