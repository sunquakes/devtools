## Quick Setup (3 Steps)

### Step 1: Register Azure AD App
1. Go to: https://portal.azure.com > Azure Active Directory > App registrations
2. Click "New registration"
3. Name: "DevTools Store Publisher"
4. Supported account types: "Accounts in this organizational directory only"
5. Click "Register"
6. Copy the "Application (client) ID" → GitHub Secret: AZURE_CLIENT_ID
7. Copy the "Directory (tenant) ID" → GitHub Secret: AZURE_TENANT_ID

### Step 2: Create Client Secret
1. In your Azure AD App > Certificates & secrets
2. Click "New client secret"
3. Description: "GitHub Actions"
4. Expires: Choose appropriate duration
5. Copy the secret value → GitHub Secret: AZURE_CLIENT_SECRET

### Step 3: Add Partner Center Permissions
1. In your Azure AD App > API permissions
2. Click "Add a permission"
3. Select "APIs my organization uses"
4. Search for "Microsoft Store"
5. Select "Microsoft Store submission API"
6. Choose "Application permissions"
7. Select:
   - AppTicket-Manage
   - AppSubmission-Manage
   - AppSubmission.Read
8. Click "Add permissions"
9. Grant admin consent for your organization

### Step 4: Get Store Product ID
1. Go to: https://partner.microsoft.com/dashboard
2. Select your app
3. Copy the Product ID from App overview page
4. → GitHub Secret: STORE_PRODUCT_ID

### Step 5: Add GitHub Secrets
1. Go to: https://github.com/settings/secrets/actions
2. Add these secrets:
   - AZURE_CLIENT_ID
   - AZURE_TENANT_ID
   - AZURE_CLIENT_SECRET
   - STORE_PRODUCT_ID

