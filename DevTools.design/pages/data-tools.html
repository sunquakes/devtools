<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据处理</title>
    <style id="theme-vars">
/* DevTools Redesign — Minimal Flat Light */
:root {
  /* Neutral palette */
  --dt-background: #F8F9FC;
  --dt-foreground: #1D1D1F;
  --dt-card: #FFFFFF;
  --dt-card-foreground: #1D1D1F;
  --dt-popover: #FFFFFF;
  --dt-popover-foreground: #1D1D1F;
  --dt-muted: #F1F3F8;
  --dt-muted-foreground: #86868B;
  --dt-border: #E5E5EA;
  --dt-input: #E8E8ED;
  --dt-ring: #007AFF;

  /* Primary */
  --dt-primary: #007AFF;
  --dt-primary-foreground: #FFFFFF;

  /* Semantic states */
  --dt-success: #34C759;
  --dt-warning: #FF9500;
  --dt-error: #FF3B30;
  --dt-info: #007AFF;

  /* Radius scale */
  --dt-radius-sm: 8px;
  --dt-radius-md: 12px;
  --dt-radius-lg: 16px;
  --dt-radius-xl: 20px;

  /* Depth / shadow */
  --dt-shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --dt-shadow-md: 0 4px 12px rgba(0,0,0,0.08);
  --dt-shadow-lg: 0 8px 24px rgba(0,0,0,0.12);

  /* Typography */
  --dt-font-sans: 'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', 'PingFang SC', sans-serif;
  --dt-font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
}

    </style>
    <style>
  /* Base */
  body { background: var(--dt-background); color: var(--dt-foreground); }
  td, th { overflow-wrap: break-word; word-break: break-all; }
  th { white-space: nowrap; }
  /* Tailwind utility static replacements (no runtime CDN needed) */
  .min-h-screen { min-height: 100vh; }
  .font-sans { font-family: var(--dt-font-sans); }
  .antialiased { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  .mx-auto { margin-left: auto; margin-right: auto; }
  .flex { display: flex; }
  .inline-flex { display: inline-flex; }
  .flex-col { flex-direction: column; }
  .flex-wrap { flex-wrap: wrap; }
  .flex-1 { flex: 1 1 0%; }
  .flex-shrink-0 { flex-shrink: 0; }
  .items-center { align-items: center; }
  .items-start { align-items: flex-start; }
  .items-end { align-items: flex-end; }
  .items-stretch { align-items: stretch; }
  .justify-center { justify-content: center; }
  .justify-between { justify-content: space-between; }
  .justify-start { justify-content: flex-start; }
  .justify-end { justify-content: flex-end; }
  .block { display: block; }
  .inline-block { display: inline-block; }
  .inline { display: inline; }
  .hidden { display: none; }
  .px-3 { padding-left: 12px; padding-right: 12px; }
  .px-4 { padding-left: 16px; padding-right: 16px; }
  .px-6 { padding-left: 24px; padding-right: 24px; }
  .px-8 { padding-left: 32px; padding-right: 32px; }
  .py-1 { padding-top: 4px; padding-bottom: 4px; }
  .py-2 { padding-top: 8px; padding-bottom: 8px; }
  .py-3 { padding-top: 12px; padding-bottom: 12px; }
  .py-4 { padding-top: 16px; padding-bottom: 16px; }
  .py-8 { padding-top: 32px; padding-bottom: 32px; }
  .pt-6 { padding-top: 24px; }
  .pb-4 { padding-bottom: 16px; }
  .pb-6 { padding-bottom: 24px; }
  .p-3 { padding: 12px; }
  .p-4 { padding: 16px; }
  .p-5 { padding: 20px; }
  .p-6 { padding: 24px; }
  .mb-1 { margin-bottom: 4px; }
  .mb-2 { margin-bottom: 8px; }
  .mt-1 { margin-top: 4px; }
  .gap-2 { gap: 8px; }
  .gap-3 { gap: 12px; }
  .gap-4 { gap: 16px; }
  .gap-5 { gap: 20px; }
  .gap-6 { gap: 24px; }
  .w-8 { width: 32px; }
  .w-9 { width: 36px; }
  .w-12 { width: 48px; }
  .w-full { width: 100%; }
  .min-w-0 { min-width: 0; }
  .h-8 { height: 32px; }
  .h-9 { height: 36px; }
  .h-12 { height: 48px; }
  .text-xs { font-size: 12px; line-height: 16px; }
  .text-sm { font-size: 14px; line-height: 20px; }
  .text-base { font-size: 16px; line-height: 24px; }
  .text-lg { font-size: 18px; line-height: 28px; }
  .text-center { text-align: center; }
  .font-medium { font-weight: 500; }
  .font-semibold { font-weight: 600; }
  .font-bold { font-weight: 700; }
  .rounded-full { border-radius: 9999px; }
  .rounded-sm { border-radius: var(--dt-radius-sm); }
  .rounded-md { border-radius: var(--dt-radius-md); }
  .rounded-lg { border-radius: var(--dt-radius-lg); }
  .border { border-width: 1px; }
  .relative { position: relative; }
  .absolute { position: absolute; }
  .fixed { position: fixed; }
  .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .uppercase { text-transform: uppercase; }
  .tracking-widest { letter-spacing: 0.1em; }
  .cursor-pointer { cursor: pointer; }
  .resize-none { resize: none; }
  .outline-none { outline: none; }
  .overflow-y-auto { overflow-y: auto; }
  .overflow-hidden { overflow: hidden; }
  .whitespace-nowrap { white-space: nowrap; }
  .break-words { overflow-wrap: break-word; }
  .focus\:outline-none:focus { outline: none; }
  .focus\:ring-2:focus { box-shadow: 0 0 0 2px var(--tw-ring-color, var(--dt-ring)); }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--dt-background); }
      .text-background { color: var(--dt-background); }
      .border-background { border-color: var(--dt-background); }
      .ring-background { --tw-ring-color: var(--dt-background); }
      .bg-foreground { background-color: var(--dt-foreground); }
      .text-foreground { color: var(--dt-foreground); }
      .border-foreground { border-color: var(--dt-foreground); }
      .ring-foreground { --tw-ring-color: var(--dt-foreground); }
      .bg-card { background-color: var(--dt-card); }
      .text-card { color: var(--dt-card); }
      .border-card { border-color: var(--dt-card); }
      .ring-card { --tw-ring-color: var(--dt-card); }
      .bg-card-foreground { background-color: var(--dt-card-foreground); }
      .text-card-foreground { color: var(--dt-card-foreground); }
      .border-card-foreground { border-color: var(--dt-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--dt-card-foreground); }
      .bg-popover { background-color: var(--dt-popover); }
      .text-popover { color: var(--dt-popover); }
      .border-popover { border-color: var(--dt-popover); }
      .ring-popover { --tw-ring-color: var(--dt-popover); }
      .bg-popover-foreground { background-color: var(--dt-popover-foreground); }
      .text-popover-foreground { color: var(--dt-popover-foreground); }
      .border-popover-foreground { border-color: var(--dt-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--dt-popover-foreground); }
      .bg-primary { background-color: var(--dt-primary); }
      .text-primary { color: var(--dt-primary); }
      .border-primary { border-color: var(--dt-primary); }
      .ring-primary { --tw-ring-color: var(--dt-primary); }
      .bg-primary-foreground { background-color: var(--dt-primary-foreground); }
      .text-primary-foreground { color: var(--dt-primary-foreground); }
      .border-primary-foreground { border-color: var(--dt-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--dt-primary-foreground); }
      .bg-muted { background-color: var(--dt-muted); }
      .text-muted { color: var(--dt-muted); }
      .border-muted { border-color: var(--dt-muted); }
      .ring-muted { --tw-ring-color: var(--dt-muted); }
      .bg-muted-foreground { background-color: var(--dt-muted-foreground); }
      .text-muted-foreground { color: var(--dt-muted-foreground); }
      .border-muted-foreground { border-color: var(--dt-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--dt-muted-foreground); }
      .bg-border { background-color: var(--dt-border); }
      .text-border { color: var(--dt-border); }
      .border-border { border-color: var(--dt-border); }
      .ring-border { --tw-ring-color: var(--dt-border); }
      .bg-input { background-color: var(--dt-input); }
      .text-input { color: var(--dt-input); }
      .border-input { border-color: var(--dt-input); }
      .ring-input { --tw-ring-color: var(--dt-input); }
      .bg-ring { background-color: var(--dt-ring); }
      .text-ring { color: var(--dt-ring); }
      .border-ring { border-color: var(--dt-ring); }
      .ring-ring { --tw-ring-color: var(--dt-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
    <style>
      /* Component styles */
      nav ul { padding: 0; }
      .tool-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 140px;
        height: 120px;
        background: var(--dt-card);
        border: 1px solid var(--dt-border);
        border-radius: var(--dt-radius-md);
        box-shadow: var(--dt-shadow-sm);
        cursor: pointer;
        transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
        gap: 10px;
      }
      .tool-card:hover {
        border-color: var(--dt-primary);
        box-shadow: var(--dt-shadow-md);
        transform: translateY(-2px);
      }
      .icon-circle {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        font-size: 20px;
      }
      .tool-card .label {
        font-size: 14px;
        color: var(--dt-foreground);
        text-align: center;
        line-height: 20px;
      }
      .tab-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        height: 100%;
        cursor: pointer;
        font-size: 14px;
        color: var(--dt-muted-foreground);
        border-bottom: 2px solid transparent;
        transition: color 0.15s ease, border-color 0.15s ease;
        white-space: nowrap;
        list-style: none;
      }
      .tab-item i { font-size: 14px; }
      .tab-item:hover { color: var(--dt-foreground); }
      .active-encoding, .active-image, .active-data, .active-query {
        color: var(--dt-primary);
        border-bottom-color: var(--dt-primary);
        font-weight: 600;
      }
      .active-encoding i, .active-image i, .active-data i, .active-query i {
        color: var(--dt-primary);
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased" style="font-family: var(--dt-font-sans); background: var(--dt-background);">

    <!-- Unified Card Container -->
    <main class="mx-auto" style="width: 1010px; max-width: 100%; background: var(--dt-card); border-radius: var(--dt-radius-lg); box-shadow: var(--dt-shadow-sm);">

      <!-- Top Bar: Search + Settings -->
      <header class="flex items-center justify-between px-8 pt-6 pb-4">
        <!-- Search Input (pill shape) -->
        <div class="relative" style="width: 320px;">
          <i class="fa-solid fa-magnifying-glass absolute" style="left: 14px; top: 50%; transform: translateY(-50%); font-size: 14px; color: var(--dt-muted-foreground);"></i>
          <input
            type="text"
            placeholder="搜索工具..."
            class="search-input"
          />
        </div>
        <!-- Settings Button (circular 36px) -->
        <button class="flex items-center justify-center cursor-pointer" style="width: 36px; height: 36px; border-radius: 50%; background: var(--dt-muted); border: 1px solid var(--dt-border);" title="设置">
          <i class="fa-solid fa-gear" style="font-size: 14px; color: var(--dt-muted-foreground);"></i>
        </button>
      </header>

      <!-- Tab Navigation -->
      <nav style="border-bottom: 1px solid var(--dt-border);">
        <ul class="flex items-end px-8" style="height: 52px; gap: 4px; list-style: none; margin: 0;">
          <!-- 编码工具 -->
          <li class="tab-item">
            <i class="fa-solid fa-code"></i>
            <span>编码工具</span>
          </li>
          <!-- 图片工具 -->
          <li class="tab-item">
            <i class="fa-solid fa-image"></i>
            <span>图片工具</span>
          </li>
          <!-- 数据处理 (active) -->
          <li class="tab-item active-data">
            <i class="fa-solid fa-database"></i>
            <span>数据处理</span>
          </li>
          <!-- 查询工具 -->
          <li class="tab-item">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>查询工具</span>
          </li>
        </ul>
      </nav>

      <!-- Tool Card Grid (Data Tools) -->
      <section class="px-8 py-8">
        <div class="flex flex-wrap gap-4 justify-start">

          <!-- JSON 格式化 -->
          <div class="tool-card">
            <div class="icon-circle" style="background: rgba(0,122,255,0.08);">
              <i class="fa-solid fa-code" style="color: var(--dt-primary);"></i>
            </div>
            <span class="label">JSON 格式化</span>
          </div>

          <!-- Base64 编码解码 -->
          <div class="tool-card">
            <div class="icon-circle" style="background: rgba(0,122,255,0.08);">
              <i class="fa-solid fa-exchange-alt" style="color: var(--dt-primary);"></i>
            </div>
            <span class="label">Base64 编码解码</span>
          </div>

          <!-- 正则表达式测试 -->
          <div class="tool-card">
            <div class="icon-circle" style="background: rgba(0,122,255,0.08);">
              <i class="fa-solid fa-asterisk" style="color: var(--dt-primary);"></i>
            </div>
            <span class="label">正则表达式测试</span>
          </div>

          <!-- 文本对比 -->
          <div class="tool-card">
            <div class="icon-circle" style="background: rgba(0,122,255,0.08);">
              <i class="fa-solid fa-columns" style="color: var(--dt-primary);"></i>
            </div>
            <span class="label">文本对比</span>
          </div>

          <!-- 字数统计 -->
          <div class="tool-card">
            <div class="icon-circle" style="background: rgba(0,122,255,0.08);">
              <i class="fa-solid fa-calculator" style="color: var(--dt-primary);"></i>
            </div>
            <span class="label">字数统计</span>
          </div>

          <!-- 进制转换 -->
          <div class="tool-card">
            <div class="icon-circle" style="background: rgba(0,122,255,0.08);">
              <i class="fa-solid fa-shuffle" style="color: var(--dt-primary);"></i>
            </div>
            <span class="label">进制转换</span>
          </div>

        </div>
      </section>

    </main>
<style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
      .search-input {
        width: 100%;
        padding: 10px 16px 10px 40px;
        font-size: 14px;
        outline: none;
        background: var(--dt-muted);
        border-radius: 9999px;
        color: var(--dt-foreground);
        border: 1px solid transparent;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      .search-input::placeholder {
        color: var(--dt-muted-foreground);
        font-size: 14px;
      }
      .search-input:focus {
        border-color: var(--dt-ring);
        box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.15);
      }
    </style>
</body>
</html>
