<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时间戳</title>
    <style id="theme-vars">
/* DevTools Redesign — Minimal Flat Light */
:root {
  /* Neutral palette */
  --dt-background: #F8F9FC;
  --dt-foreground: #1D1D1F;
  --dt-card: #FFFFFF;
  --dt-card-foreground: #1D1D1F;
  --dt-popover: #FFFFFF;
  --dt-popover-foreground: #1D1D1F;
  --dt-muted: #F1F3F8;
  --dt-muted-foreground: #86868B;
  --dt-border: #E5E5EA;
  --dt-input: #E8E8ED;
  --dt-ring: #007AFF;

  /* Primary */
  --dt-primary: #007AFF;
  --dt-primary-foreground: #FFFFFF;

  /* Semantic states */
  --dt-success: #34C759;
  --dt-warning: #FF9500;
  --dt-error: #FF3B30;
  --dt-info: #007AFF;

  /* Radius scale */
  --dt-radius-sm: 8px;
  --dt-radius-md: 12px;
  --dt-radius-lg: 16px;
  --dt-radius-xl: 20px;

  /* Depth / shadow */
  --dt-shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --dt-shadow-md: 0 4px 12px rgba(0,0,0,0.08);
  --dt-shadow-lg: 0 8px 24px rgba(0,0,0,0.12);

  /* Typography */
  --dt-font-sans: 'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', 'PingFang SC', sans-serif;
  --dt-font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--dt-background);
    --color-foreground: var(--dt-foreground);
    --color-card: var(--dt-card);
    --color-card-foreground: var(--dt-card-foreground);
    --color-popover: var(--dt-popover);
    --color-popover-foreground: var(--dt-popover-foreground);
    --color-primary: var(--dt-primary);
    --color-primary-foreground: var(--dt-primary-foreground);
    --color-muted: var(--dt-muted);
    --color-muted-foreground: var(--dt-muted-foreground);
    --color-border: var(--dt-border);
    --color-input: var(--dt-input);
    --color-ring: var(--dt-ring);
    --radius-sm: var(--dt-radius-sm);
    --radius-md: var(--dt-radius-md);
    --radius-lg: var(--dt-radius-lg);
    --radius-xl: var(--dt-radius-xl);
  }
  @layer base {
    body { background: var(--dt-background); color: var(--dt-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--dt-background); }
      .text-background { color: var(--dt-background); }
      .border-background { border-color: var(--dt-background); }
      .ring-background { --tw-ring-color: var(--dt-background); }
      .bg-foreground { background-color: var(--dt-foreground); }
      .text-foreground { color: var(--dt-foreground); }
      .border-foreground { border-color: var(--dt-foreground); }
      .ring-foreground { --tw-ring-color: var(--dt-foreground); }
      .bg-card { background-color: var(--dt-card); }
      .text-card { color: var(--dt-card); }
      .border-card { border-color: var(--dt-card); }
      .ring-card { --tw-ring-color: var(--dt-card); }
      .bg-card-foreground { background-color: var(--dt-card-foreground); }
      .text-card-foreground { color: var(--dt-card-foreground); }
      .border-card-foreground { border-color: var(--dt-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--dt-card-foreground); }
      .bg-popover { background-color: var(--dt-popover); }
      .text-popover { color: var(--dt-popover); }
      .border-popover { border-color: var(--dt-popover); }
      .ring-popover { --tw-ring-color: var(--dt-popover); }
      .bg-popover-foreground { background-color: var(--dt-popover-foreground); }
      .text-popover-foreground { color: var(--dt-popover-foreground); }
      .border-popover-foreground { border-color: var(--dt-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--dt-popover-foreground); }
      .bg-primary { background-color: var(--dt-primary); }
      .text-primary { color: var(--dt-primary); }
      .border-primary { border-color: var(--dt-primary); }
      .ring-primary { --tw-ring-color: var(--dt-primary); }
      .bg-primary-foreground { background-color: var(--dt-primary-foreground); }
      .text-primary-foreground { color: var(--dt-primary-foreground); }
      .border-primary-foreground { border-color: var(--dt-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--dt-primary-foreground); }
      .bg-muted { background-color: var(--dt-muted); }
      .text-muted { color: var(--dt-muted); }
      .border-muted { border-color: var(--dt-muted); }
      .ring-muted { --tw-ring-color: var(--dt-muted); }
      .bg-muted-foreground { background-color: var(--dt-muted-foreground); }
      .text-muted-foreground { color: var(--dt-muted-foreground); }
      .border-muted-foreground { border-color: var(--dt-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--dt-muted-foreground); }
      .bg-border { background-color: var(--dt-border); }
      .text-border { color: var(--dt-border); }
      .border-border { border-color: var(--dt-border); }
      .ring-border { --tw-ring-color: var(--dt-border); }
      .bg-input { background-color: var(--dt-input); }
      .text-input { color: var(--dt-input); }
      .border-input { border-color: var(--dt-input); }
      .ring-input { --tw-ring-color: var(--dt-input); }
      .bg-ring { background-color: var(--dt-ring); }
      .text-ring { color: var(--dt-ring); }
      .border-ring { border-color: var(--dt-ring); }
      .ring-ring { --tw-ring-color: var(--dt-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="min-h-screen flex flex-col" style="background:var(--dt-background)">

      <!-- Navigation Bar -->
      <nav class="flex items-center justify-between px-6 py-4" style="background:var(--dt-card);border-bottom:1px solid var(--dt-border)">
        <button class="flex items-center justify-center rounded-full" style="width:36px;height:36px;background:var(--dt-muted)" aria-label="返回">
          <i class="fa-solid fa-arrow-left text-sm" style="color:var(--dt-foreground)"></i>
        </button>
        <h1 class="font-semibold" style="font-size:18px;color:var(--dt-foreground)">时间戳</h1>
        <div style="width:36px"></div>
      </nav>

      <!-- Main Content -->
      <div class="flex-1 flex items-center justify-center px-8 py-8">
        <div class="flex items-stretch gap-6 w-full" style="max-width:780px">

          <!-- LEFT: 当前时间戳 -->
          <div class="flex-1 flex flex-col gap-3">
            <label class="text-xs font-medium tracking-widest uppercase" style="color:var(--dt-muted-foreground)">当前时间戳</label>
            <div class="flex-1 rounded-md p-5" style="background:var(--dt-card);border:1px solid var(--dt-border);box-shadow:var(--dt-shadow-sm)">

              <!-- Row: 毫秒 -->
              <div class="flex items-center justify-between py-2.5" style="border-bottom:1px solid var(--dt-border)">
                <div>
                  <div class="mb-1" style="font-size:12px;color:var(--dt-muted-foreground)">毫秒 (ms)</div>
                  <div style="font-family:var(--dt-font-mono);font-size:14px;color:var(--dt-foreground)">1784952901523</div>
                </div>
                <button class="flex items-center justify-center cursor-pointer" style="width:32px;height:32px;border-radius:var(--dt-radius-sm);background:var(--dt-muted)" title="复制">
                  <i class="fa-regular fa-copy text-xs" style="color:var(--dt-muted-foreground)"></i>
                </button>
              </div>

              <!-- Row: 秒 -->
              <div class="flex items-center justify-between py-2.5" style="border-bottom:1px solid var(--dt-border)">
                <div>
                  <div class="mb-1" style="font-size:12px;color:var(--dt-muted-foreground)">秒 (s)</div>
                  <div style="font-family:var(--dt-font-mono);font-size:14px;color:var(--dt-foreground)">1784952901</div>
                </div>
                <button class="flex items-center justify-center cursor-pointer" style="width:32px;height:32px;border-radius:var(--dt-radius-sm);background:var(--dt-muted)" title="复制">
                  <i class="fa-regular fa-copy text-xs" style="color:var(--dt-muted-foreground)"></i>
                </button>
              </div>

              <!-- Row: 日期时间 -->
              <div class="flex items-center justify-between py-2.5">
                <div>
                  <div class="mb-1" style="font-size:12px;color:var(--dt-muted-foreground)">日期时间</div>
                  <div style="font-family:var(--dt-font-mono);font-size:14px;color:var(--dt-foreground)">2026-07-25 12:15:01</div>
                </div>
                <button class="flex items-center justify-center cursor-pointer" style="width:32px;height:32px;border-radius:var(--dt-radius-sm);background:var(--dt-muted)" title="复制">
                  <i class="fa-regular fa-copy text-xs" style="color:var(--dt-muted-foreground)"></i>
                </button>
              </div>
            </div>

            <!-- Refresh Button (full-width, primary blue) -->
            <button class="flex items-center justify-center gap-2 cursor-pointer w-full" style="padding:10px 0;background:var(--dt-primary);color:var(--dt-primary-foreground);font-size:14px;font-weight:500;border-radius:var(--dt-radius-lg)">
              <i class="fa-solid fa-rotate-right text-sm"></i>
              <span>刷新</span>
            </button>
          </div>

          <!-- RIGHT: Unix时间戳转换 -->
          <div class="flex-1 flex flex-col gap-3">
            <label class="text-xs font-medium tracking-widest uppercase" style="color:var(--dt-muted-foreground)">Unix时间戳转换</label>
            <div class="flex-1 rounded-md p-5 flex flex-col gap-4" style="background:var(--dt-card);border:1px solid var(--dt-border);box-shadow:var(--dt-shadow-sm)">

              <!-- Input -->
              <div>
                <label class="block mb-1.5" style="font-size:12px;color:var(--dt-muted-foreground)">输入时间戳</label>
                <input type="text" placeholder="例如: 1784952901" class="w-full outline-none" style="padding:10px 14px;font-family:var(--dt-font-mono);font-size:14px;background:var(--dt-muted);border:1px solid var(--dt-border);border-radius:var(--dt-radius-sm);color:var(--dt-foreground)">
              </div>

              <!-- Output -->
              <div>
                <label class="block mb-1.5" style="font-size:12px;color:var(--dt-muted-foreground)">转换结果</label>
                <div class="flex items-center gap-2">
                  <div class="flex-1" style="padding:10px 14px;font-family:var(--dt-font-mono);font-size:14px;background:var(--dt-muted);border:1px solid var(--dt-border);border-radius:var(--dt-radius-sm);color:var(--dt-foreground);min-height:40px">2026-07-25 12:15:01</div>
                  <button class="flex items-center justify-center cursor-pointer flex-shrink-0" style="width:40px;height:40px;border-radius:var(--dt-radius-sm);background:var(--dt-muted);border:1px solid var(--dt-border)" title="复制">
                    <i class="fa-regular fa-copy text-xs" style="color:var(--dt-muted-foreground)"></i>
                  </button>
                </div>
              </div>

              <!-- Convert Button (full-width, inside card, primary blue) -->
              <button class="flex items-center justify-center gap-2 cursor-pointer w-full mt-auto" style="padding:10px 0;background:var(--dt-primary);color:var(--dt-primary-foreground);font-size:14px;font-weight:500;border-radius:var(--dt-radius-lg)">
                <i class="fa-solid fa-arrow-right-arrow-left text-sm"></i>
                <span>转换</span>
              </button>
            </div>
          </div>

        </div>
      </div>

    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
