<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二维码</title>
    <style id="theme-vars">
/* DevTools Redesign — Minimal Flat Light */
:root {
  /* Neutral palette */
  --dt-background: #F8F9FC;
  --dt-foreground: #1D1D1F;
  --dt-card: #FFFFFF;
  --dt-card-foreground: #1D1D1F;
  --dt-popover: #FFFFFF;
  --dt-popover-foreground: #1D1D1F;
  --dt-muted: #F1F3F8;
  --dt-muted-foreground: #86868B;
  --dt-border: #E5E5EA;
  --dt-input: #E8E8ED;
  --dt-ring: #007AFF;

  /* Primary */
  --dt-primary: #007AFF;
  --dt-primary-foreground: #FFFFFF;

  /* Semantic states */
  --dt-success: #34C759;
  --dt-warning: #FF9500;
  --dt-error: #FF3B30;
  --dt-info: #007AFF;

  /* Radius scale */
  --dt-radius-sm: 8px;
  --dt-radius-md: 12px;
  --dt-radius-lg: 16px;
  --dt-radius-xl: 20px;

  /* Depth / shadow */
  --dt-shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --dt-shadow-md: 0 4px 12px rgba(0,0,0,0.08);
  --dt-shadow-lg: 0 8px 24px rgba(0,0,0,0.12);

  /* Typography */
  --dt-font-sans: 'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', 'PingFang SC', sans-serif;
  --dt-font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--dt-background);
    --color-foreground: var(--dt-foreground);
    --color-card: var(--dt-card);
    --color-card-foreground: var(--dt-card-foreground);
    --color-popover: var(--dt-popover);
    --color-popover-foreground: var(--dt-popover-foreground);
    --color-primary: var(--dt-primary);
    --color-primary-foreground: var(--dt-primary-foreground);
    --color-muted: var(--dt-muted);
    --color-muted-foreground: var(--dt-muted-foreground);
    --color-border: var(--dt-border);
    --color-input: var(--dt-input);
    --color-ring: var(--dt-ring);
    --radius-sm: var(--dt-radius-sm);
    --radius-md: var(--dt-radius-md);
    --radius-lg: var(--dt-radius-lg);
    --radius-xl: var(--dt-radius-xl);
  }
  @layer base {
    body { background: var(--dt-background); color: var(--dt-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--dt-background); }
      .text-background { color: var(--dt-background); }
      .border-background { border-color: var(--dt-background); }
      .ring-background { --tw-ring-color: var(--dt-background); }
      .bg-foreground { background-color: var(--dt-foreground); }
      .text-foreground { color: var(--dt-foreground); }
      .border-foreground { border-color: var(--dt-foreground); }
      .ring-foreground { --tw-ring-color: var(--dt-foreground); }
      .bg-card { background-color: var(--dt-card); }
      .text-card { color: var(--dt-card); }
      .border-card { border-color: var(--dt-card); }
      .ring-card { --tw-ring-color: var(--dt-card); }
      .bg-card-foreground { background-color: var(--dt-card-foreground); }
      .text-card-foreground { color: var(--dt-card-foreground); }
      .border-card-foreground { border-color: var(--dt-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--dt-card-foreground); }
      .bg-popover { background-color: var(--dt-popover); }
      .text-popover { color: var(--dt-popover); }
      .border-popover { border-color: var(--dt-popover); }
      .ring-popover { --tw-ring-color: var(--dt-popover); }
      .bg-popover-foreground { background-color: var(--dt-popover-foreground); }
      .text-popover-foreground { color: var(--dt-popover-foreground); }
      .border-popover-foreground { border-color: var(--dt-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--dt-popover-foreground); }
      .bg-primary { background-color: var(--dt-primary); }
      .text-primary { color: var(--dt-primary); }
      .border-primary { border-color: var(--dt-primary); }
      .ring-primary { --tw-ring-color: var(--dt-primary); }
      .bg-primary-foreground { background-color: var(--dt-primary-foreground); }
      .text-primary-foreground { color: var(--dt-primary-foreground); }
      .border-primary-foreground { border-color: var(--dt-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--dt-primary-foreground); }
      .bg-muted { background-color: var(--dt-muted); }
      .text-muted { color: var(--dt-muted); }
      .border-muted { border-color: var(--dt-muted); }
      .ring-muted { --tw-ring-color: var(--dt-muted); }
      .bg-muted-foreground { background-color: var(--dt-muted-foreground); }
      .text-muted-foreground { color: var(--dt-muted-foreground); }
      .border-muted-foreground { border-color: var(--dt-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--dt-muted-foreground); }
      .bg-border { background-color: var(--dt-border); }
      .text-border { color: var(--dt-border); }
      .border-border { border-color: var(--dt-border); }
      .ring-border { --tw-ring-color: var(--dt-border); }
      .bg-input { background-color: var(--dt-input); }
      .text-input { color: var(--dt-input); }
      .border-input { border-color: var(--dt-input); }
      .ring-input { --tw-ring-color: var(--dt-input); }
      .bg-ring { background-color: var(--dt-ring); }
      .text-ring { color: var(--dt-ring); }
      .border-ring { border-color: var(--dt-ring); }
      .ring-ring { --tw-ring-color: var(--dt-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased" style="background:var(--dt-background);">
    <main class="min-h-screen flex flex-col" style="background:var(--dt-background);">
      <!-- Navigation bar -->
      <nav class="flex items-center justify-between px-6 py-4" style="background:var(--dt-card);border-bottom:1px solid var(--dt-border);">
        <!-- Back button -->
        <button class="flex items-center justify-center rounded-full" style="width:36px;height:36px;background:var(--dt-muted);" aria-label="返回">
          <i class="fa-solid fa-arrow-left" style="color:var(--dt-foreground);font-size:14px;"></i>
        </button>
        <!-- Title -->
        <span class="text-center" style="font-size:18px;font-weight:600;color:var(--dt-foreground);">二维码</span>
        <!-- Delete button -->
        <button class="flex items-center justify-center rounded-full" style="width:36px;height:36px;background:var(--dt-muted);" aria-label="删除">
          <i class="fa-solid fa-trash-can" style="color:var(--dt-foreground);font-size:14px;"></i>
        </button>
      </nav>

      <!-- Input area -->
      <div class="px-6 pt-6 pb-4" style="padding-left:24px;padding-right:24px;">
        <label class="block mb-2" style="font-size:14px;color:var(--dt-foreground);">二维码</label>
        <div class="flex items-center gap-3">
          <input type="text" value="123" class="flex-1 outline-none" style="height:44px;padding:0 14px;border-radius:var(--dt-radius-md);border:1px solid var(--dt-border);background:var(--dt-card);font-size:14px;color:var(--dt-foreground);box-sizing:border-box;" />
          <button class="flex items-center gap-2 cursor-pointer" style="height:44px;padding:0 20px;border-radius:var(--dt-radius-md);background:var(--dt-primary);color:var(--dt-primary-foreground);font-size:14px;font-weight:500;border:none;white-space:nowrap;">
            <i class="fa-solid fa-qrcode" style="font-size:16px;"></i>
            <span>生成</span>
          </button>
        </div>
      </div>

      <!-- QR Code card list (scrollable) -->
      <div class="flex-1 overflow-y-auto px-6 pb-6" style="padding-left:24px;padding-right:24px;">
        <div class="flex flex-col gap-4">
          <!-- QR Card 1 -->
          <div class="flex gap-5 p-5" style="background:var(--dt-card);border:1px solid var(--dt-border);border-radius:var(--dt-radius-md);box-shadow:var(--dt-shadow-sm);">
            <!-- QR code placeholder -->
            <div class="flex flex-col items-center gap-2 flex-shrink-0">
              <div class="flex items-center justify-center" style="width:120px;height:120px;border-radius:var(--dt-radius-sm);background:var(--dt-muted);border:1px solid var(--dt-border);">
                <i class="fa-solid fa-qrcode" style="font-size:56px;color:var(--dt-muted-foreground);"></i>
              </div>
              <span style="font-family:var(--dt-font-mono);font-size:13px;color:var(--dt-foreground);">123</span>
            </div>
            <!-- Metadata -->
            <div class="flex flex-col justify-between flex-1 py-1">
              <div>
                <p style="font-size:12px;color:var(--dt-muted-foreground);margin:0;">双击修改备注</p>
              </div>
              <div>
                <p style="font-size:12px;color:var(--dt-muted-foreground);margin:0;">2026-04-10 21:41:09</p>
              </div>
              <!-- Action buttons -->
              <div class="flex gap-2 justify-end">
                <button class="flex items-center justify-center" style="width:32px;height:32px;border-radius:var(--dt-radius-sm);background:var(--dt-muted);border:none;cursor:pointer;" aria-label="查看">
                  <i class="fa-solid fa-eye" style="font-size:13px;color:var(--dt-foreground);"></i>
                </button>
                <button class="flex items-center justify-center" style="width:32px;height:32px;border-radius:var(--dt-radius-sm);background:var(--dt-muted);border:none;cursor:pointer;" aria-label="复制">
                  <i class="fa-solid fa-check" style="font-size:13px;color:var(--dt-foreground);"></i>
                </button>
                <button class="flex items-center justify-center" style="width:32px;height:32px;border-radius:var(--dt-radius-sm);background:var(--dt-muted);border:none;cursor:pointer;" aria-label="加密">
                  <i class="fa-solid fa-lock" style="font-size:13px;color:var(--dt-foreground);"></i>
                </button>
                <button class="flex items-center justify-center" style="width:32px;height:32px;border-radius:var(--dt-radius-sm);background:var(--dt-muted);border:none;cursor:pointer;" aria-label="删除">
                  <i class="fa-solid fa-trash-can" style="font-size:13px;color:var(--dt-foreground);"></i>
                </button>
              </div>
            </div>
          </div>

          <!-- QR Card 2 -->
          <div class="flex gap-5 p-5" style="background:var(--dt-card);border:1px solid var(--dt-border);border-radius:var(--dt-radius-md);box-shadow:var(--dt-shadow-sm);">
            <!-- QR code placeholder -->
            <div class="flex flex-col items-center gap-2 flex-shrink-0">
              <div class="flex items-center justify-center" style="width:120px;height:120px;border-radius:var(--dt-radius-sm);background:var(--dt-muted);border:1px solid var(--dt-border);">
                <i class="fa-solid fa-qrcode" style="font-size:56px;color:var(--dt-muted-foreground);"></i>
              </div>
              <span style="font-family:var(--dt-font-mono);font-size:13px;color:var(--dt-foreground);">123</span>
            </div>
            <!-- Metadata -->
            <div class="flex flex-col justify-between flex-1 py-1">
              <div>
                <p style="font-size:12px;color:var(--dt-muted-foreground);margin:0;">双击修改备注</p>
              </div>
              <div>
                <p style="font-size:12px;color:var(--dt-muted-foreground);margin:0;">2026-04-10 21:41:09</p>
              </div>
              <!-- Action buttons -->
              <div class="flex gap-2 justify-end">
                <button class="flex items-center justify-center" style="width:32px;height:32px;border-radius:var(--dt-radius-sm);background:var(--dt-muted);border:none;cursor:pointer;" aria-label="查看">
                  <i class="fa-solid fa-eye" style="font-size:13px;color:var(--dt-foreground);"></i>
                </button>
                <button class="flex items-center justify-center" style="width:32px;height:32px;border-radius:var(--dt-radius-sm);background:var(--dt-muted);border:none;cursor:pointer;" aria-label="复制">
                  <i class="fa-solid fa-check" style="font-size:13px;color:var(--dt-foreground);"></i>
                </button>
                <button class="flex items-center justify-center" style="width:32px;height:32px;border-radius:var(--dt-radius-sm);background:var(--dt-muted);border:none;cursor:pointer;" aria-label="加密">
                  <i class="fa-solid fa-lock" style="font-size:13px;color:var(--dt-foreground);"></i>
                </button>
                <button class="flex items-center justify-center" style="width:32px;height:32px;border-radius:var(--dt-radius-sm);background:var(--dt-muted);border:none;cursor:pointer;" aria-label="删除">
                  <i class="fa-solid fa-trash-can" style="font-size:13px;color:var(--dt-foreground);"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
